# The ubiquitous language: one concept, one name, and the names it must not
# be called. Concepts only — how a concept is spelled in Ruby or Rust, what
# grade that spelling carries, and which behaviour anchors govern it all
# belong to the interface and behavior specs, which are written in these
# words rather than referenced from them.
#
# A `not` entry is admissible only when its word appears zero times in the
# spec corpus. Two words that both name concepts of ours (Execution and
# Invocation) are told apart by their definitions, not by a scan.
#
# Entries accumulate: a concept the corpus uses and this file lacks is a gap
# to fill, not a rule to relax. `rake spec:generate` renders glossary.md from
# this file.

- term: Host App
  definition: >-
    The application that embeds kobako. It holds every credential and policy
    decision, and chooses which of its own objects the guest may reach.

- term: Host Gem
  definition: >-
    kobako itself — the side of the boundary that owns the guest, routes what
    it asks for, and decides what each outcome means.

- term: Guest Binary
  definition: >-
    The compiled artifact untrusted code runs inside. It is the isolation
    boundary: nothing crosses it except as a message.

- term: Service
  definition: >-
    A host object the guest reaches by name. It is the only route from guest
    code to a host resource.
  not:
    - word: adapter
      why: >-
        Names a translation role. What distinguishes a Service is that the
        guest can name it at all.

- term: Wire Spec
  definition: >-
    The contract every message crossing the boundary answers to. Each side
    implements it independently, so it is an agreement rather than a shared
    component.

- term: Transport
  definition: >-
    The exchange of messages across the boundary. One Call is answered by one
    Reply, and both directions use that same pair.

- term: Envelope
  definition: >-
    The part of a message that says where it goes and how it turned out. It is
    readable without a Codec, so routing and attribution never depend on one.

- term: Codec
  definition: >-
    The agreement two endpoints reach about how values become bytes. It is
    replaceable: only the two endpoints need to share one.

- term: Outcome
  definition: >-
    The final result of one Invocation. Every Invocation writes exactly one,
    whether it succeeded or failed.

- term: Panic
  definition: >-
    The failed arm of an Outcome. It attributes the failure to a side of the
    boundary and carries the Error Record describing it.

- term: Fault
  definition: >-
    The reason a Call is refused, returned to whoever issued it. It is
    kobako's own data rather than the caller's, so it rides the Envelope.

- term: Error Record
  definition: >-
    A failure's name, message, and backtrace as one unit. Every channel that
    reports a guest failure carries this same shape.

- term: Run
  definition: >-
    An Invocation that names an entrypoint already loaded in the guest,
    instead of supplying source to execute.

- term: Frame
  definition: >-
    Setup data handed to the guest before an Invocation begins, so the guest
    starts knowing what this run was configured with.

- term: Catalog
  definition: >-
    What a Sandbox has registered — the bindings and preloads fixed at setup,
    together with the Handle table each Invocation mints for itself.

- term: Invocation
  definition: >-
    One run of guest code, from entry until it settles. It is the act; the
    Execution is the record it leaves.

- term: Execution
  definition: >-
    The record one Invocation leaves — what it produced, what it wrote, and
    what it consumed. Frozen once the Invocation settles, and never revised.
