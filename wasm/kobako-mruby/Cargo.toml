# kobako-mruby — the assembled mruby implementation of the Guest ABI.
#
# The `MrbGuest` trait harness (required `init_gems` hook + a
# `Codec` choice + provided `eval` / `run` / `yield_to_block`
# flows over mruby), the wire-tied `KobakoBridge` built-in gem (Service
# / Handle dispatch, block/yield machinery), and the bundled
# MessagePack codec behind the `msgpack` feature. A guest shell
# implements `MrbGuest`, forwards `kobako_core::Guest` to it, and emits
# the exports with `kobako_core::export_guest!` — the in-repo
# `kobako-wasm` shell is the worked example.

[package]
name = "kobako-mruby"
version = "0.12.0"
edition = "2021"
description = "Assembled mruby implementation of the kobako Guest ABI — the MrbGuest harness and the KobakoBridge gem, built on beni."
license = "Apache-2.0"
repository = "https://github.com/elct9620/kobako"
readme = "README.md"
keywords = ["wasm", "mruby", "sandbox", "wasi"]
categories = ["wasm"]

[features]
# The bundled MessagePack payload codec — `MsgpackCodec` and the
# mruby ↔ wire value walk beneath it. On by default because it is what
# the shipped Guest Binary and the Ruby frontend speak; a shell naming
# its own `MrbGuest::Codec` turns it off and carries no MessagePack.
default = ["msgpack"]
msgpack = ["dep:kobako-codec", "kobako-codec/msgpack"]

[dependencies]
# The fixed tier. Unconditional: the flows frame every message with the
# core envelope whatever schema fills it.
kobako-transport = { path = "../../crates/kobako-transport", version = "0.12.0" }

# The bundled payload codec, and the only optional dependency here —
# which schema fills those frames is the shell's choice, so a shell
# naming its own `MrbGuest::Codec` carries none of this.
kobako-codec = { path = "../../crates/kobako-codec", version = "0.12.0", default-features = false, optional = true }

# Guest ABI contract crate — the ABI primitives (outcome buffer,
# frames, dispatch proxy) the provided flows implement the contract
# with.
kobako-core = { path = "../kobako-core", version = "0.12.0" }

# Typed mruby wrapper — `Mrb` / `Value` seams, the `Gem` trait, and
# the `beni::sys` re-export the yield machinery's raw shims go
# through.
beni = "0.10.0"

# Direct dependency on the FFI layer so cargo forwards its
# `links = "mruby"` metadata (`DEP_MRUBY_LINKED`) to this crate's
# build script — see build.rs. Code never names this path; call
# sites go through the `beni::sys` re-export.
beni-sys = "0.10.0"
