# kobako-io — sandbox IO / File / Kernel capability gem.
#
# The `::IO` class, `STDOUT` / `STDERR`, the assignable `$stdout` /
# `$stderr` globals, `::File < IO` over the preopened directories, and
# the private Kernel output delegators for a kobako mruby guest. Pure
# Rust over beni — the whole Ruby-level surface is defined through the
# typed wrapper; no mrblib, no mrbc / RITE pipeline. kobako-free by
# design: it reaches the host only through wasi-libc, so the gem depends
# on the `beni` wrapper alone and any guest shell can compose it.

[package]
name = "kobako-io"
version = "0.20.0"
edition = "2021"
description = "Sandbox IO / File / Kernel capability gem for kobako mruby guests — $stdout / $stderr and preopened files over wasi-libc, built on beni."
license = "Apache-2.0"
repository = "https://github.com/elct9620/kobako"
readme = "README.md"
keywords = ["wasm", "mruby", "sandbox", "wasi", "io"]
categories = ["wasm"]

[dependencies]
# Typed mruby wrapper — the `Gem` trait this crate implements plus
# every `Mrb` / `Value` seam the bridges use; the gem's only
# dependency.
beni = "0.25.0"
