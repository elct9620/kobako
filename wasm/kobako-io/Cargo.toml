# kobako-io — sandbox IO capability gem.
#
# The `::IO` class, `STDOUT` / `STDERR`, the assignable `$stdout` /
# `$stderr` globals, `::File < IO` and `::Dir` over the preopened directories,
# the private Kernel writers, the sockets and `IO.select`, and `Net::HTTP`
# for a kobako mruby guest. Pure
# Rust over beni — the whole Ruby-level surface is defined through the
# typed wrapper; no mrblib, no mrbc / RITE pipeline. kobako-free by
# design: it reaches the host only through WASI, preview1 through
# wasi-libc and the sockets through WASI 0.2, so any guest shell exporting
# `cabi_realloc` can compose it.

[package]
name = "kobako-io"
version = "0.21.0"
edition = "2021"
description = "Sandbox IO / File / Kernel capability gem for kobako mruby guests — $stdout / $stderr and preopened files over wasi-libc, sockets and Net::HTTP over WASI 0.2, built on beni."
license = "Apache-2.0"
repository = "https://github.com/elct9620/kobako"
readme = "README.md"
keywords = ["wasm", "mruby", "sandbox", "wasi", "io"]
categories = ["wasm"]

[dependencies]
# Typed mruby wrapper — the `Gem` trait this crate implements plus
# every `Mrb` / `Value` seam the bridges use.
beni = "0.27.0"
# Generates the WASI 0.2 interfaces the guest imports from `wit/`, as
# wasi-libc imports preview1. Its runtime is `wasi::rt`, not the `wit-bindgen`
# crate's, so the Guest Binary exports only the ABI's own `cabi_realloc`.
wit-bindgen-rust-macro = "0.63.0"
