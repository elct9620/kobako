name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  # The specification check needs neither Ruby nor Rust, so it stands apart
  # from the build matrix rather than repeating itself once per Ruby version.
  spec:
    runs-on: ubuntu-latest
    name: Specification
    env:
      # Pinned by hand: nothing watches a release asset fetched over curl.
      # The digest is pinned alongside the tag because an asset can be replaced.
      SUMI_VERSION: 0.1.0-preview14
      SUMI_SHA256: 0981cd0eeeeece7a31ee3d9b1858c71028077b26fbf36f5021912a6c730398df
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install sumi
        run: |
          curl -sSL -o "$RUNNER_TEMP/sumi.tar.gz" \
            "https://github.com/elct9620/sumitsubo/releases/download/v$SUMI_VERSION/sumi-$SUMI_VERSION-linux-x86_64.tar.gz"
          echo "$SUMI_SHA256  $RUNNER_TEMP/sumi.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/sumi.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Check the source against the specification
        run: sumi verify
      # The form is held locally by an edit hook, which reaches only what this
      # repository's own tooling writes. Here it is held for every commit.
      - name: Check the specification is written the way a reference line is
        run: sumi fmt --check

  # A Guest Binary is the same wasm whichever host builds it, so one job
  # runs the guest's checks, building every variant as a release does,
  # and every build job tests that one. Cargo decides what recompiles,
  # with its dependencies restored from the cache.
  wasm:
    runs-on: ubuntu-latest
    name: Guest Binary
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: '4.0'
          bundler-cache: true
          rubygems: '3.6.9'
      - name: Set up Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          components: clippy
          targets: wasm32-wasip1
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            wasm
            wasm/kobako-baker
      - name: Run the guest's checks
        run: bundle exec rake check:guest
      - name: cargo clippy (wasm/ and the baker, host target)
        env:
          BENI_VENDOR_DIR: ${{ github.workspace }}/vendor
        run: |
          cargo clippy --manifest-path wasm/Cargo.toml --workspace --all-targets -- -D warnings
          cargo clippy --manifest-path wasm/kobako-baker/Cargo.toml --all-targets -- -D warnings
      - name: cargo clippy (wasm/, wasm32-wasip1)
        # beni-sys requires the mruby archive paths explicitly on cross
        # targets; the guest's checks above staged them.
        env:
          MRUBY_LIB_DIR: ${{ github.workspace }}/vendor/mruby/build/wasi/lib
          WASI_SDK_PATH: ${{ github.workspace }}/vendor/wasi-sdk
        run: cargo clippy --manifest-path wasm/Cargo.toml --workspace --target wasm32-wasip1 -- -D warnings
      - name: cargo doc (wasm/ and the baker, private items)
        env:
          RUSTDOCFLAGS: -D warnings
          BENI_VENDOR_DIR: ${{ github.workspace }}/vendor
        run: |
          cargo doc --manifest-path wasm/Cargo.toml --workspace --no-deps --document-private-items
          cargo doc --manifest-path wasm/kobako-baker/Cargo.toml --no-deps --document-private-items
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kobako-wasm
          path: data/*.wasm
          retention-days: 1
          if-no-files-found: error

  # Every Ruby a native gem ships for runs on Linux; each other host the
  # gem ships for runs the newest, since what differs there is the host's
  # own calls a Bind makes, not the Ruby ABI. The Linux jobs keep the
  # names the pull request ruleset requires.
  build:
    runs-on: ${{ matrix.os }}
    name: Ruby ${{ matrix.ruby }}${{ matrix.suffix }}
    needs: wasm
    # The ext a test loads only needs to work, so the release profile builds
    # it without LTO and in more codegen units, as wasmtime-rb's CI does;
    # the shipped gems are built by the release workflow.
    env:
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-26
          - windows-latest
        ruby:
          - '3.3'
          - '3.4'
          - '4.0'
        exclude:
          - os: macos-26
            ruby: '3.3'
          - os: macos-26
            ruby: '3.4'
          - os: windows-latest
            ruby: '3.3'
          - os: windows-latest
            ruby: '3.4'
        include:
          - os: macos-26
            suffix: ' (macOS)'
          - os: windows-latest
            suffix: ' (Windows)'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read Rust channel from rust-toolchain.toml
        id: rust
        shell: bash
        run: echo "channel=$(grep '^channel' rust-toolchain.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      # Installs the Rust toolchain matching the Ruby's ABI, so on Windows
      # the GNU one RubyInstaller's MinGW Ruby links against.
      - name: Set up Ruby and Rust
        uses: oxidize-rb/actions/setup-ruby-and-rust@ec90b4aa48795518d79be3f5cc478d1d7ccd02a8 # v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          rubygems: '3.6.9'
          rustup-toolchain: ${{ steps.rust.outputs.channel }}
          cargo-cache: 'false'
      # rust-toolchain.toml names a channel, which rustup completes with the
      # runner's MSVC host; RUSTUP_TOOLCHAIN outranks the file, so cargo stays
      # on the GNU toolchain installed above.
      - name: Keep cargo on the GNU toolchain
        if: runner.os == 'Windows'
        shell: bash
        run: echo "RUSTUP_TOOLCHAIN=${{ steps.rust.outputs.channel }}-x86_64-pc-windows-gnu" >> "$GITHUB_ENV"
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            .
            crates
      - name: Fetch the Guest Binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: kobako-wasm
          path: data/
      - name: Run the host's checks
        run: bundle exec rake check:host
      - name: cargo fmt --check (every workspace)
        if: matrix.os == 'ubuntu-latest' && matrix.ruby == '4.0'
        run: |
          cargo fmt --manifest-path ext/kobako/Cargo.toml -- --check
          cargo fmt --manifest-path crates/Cargo.toml --all -- --check
          cargo fmt --manifest-path wasm/Cargo.toml --all -- --check
          cargo fmt --manifest-path wasm/kobako-baker/Cargo.toml -- --check
      - name: cargo clippy (ext, host target)
        run: cargo clippy --manifest-path Cargo.toml --workspace --all-targets -- -D warnings
      - name: cargo clippy (crates/, host workspace)
        run: cargo clippy --manifest-path crates/Cargo.toml --workspace --all-targets -- -D warnings
      - name: cargo doc (ext and crates/, private items)
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --manifest-path Cargo.toml --workspace --no-deps --document-private-items
          cargo doc --manifest-path crates/Cargo.toml --workspace --no-deps --document-private-items
