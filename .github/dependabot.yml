version: 2

# The beni gem builds the archive the beni crates link, and the two
# release in lockstep. Each ecosystem holds beni in a group of its own,
# listed first so it takes beni ahead of the catch-all, and the gem and
# crate PRs each fail alone: bump both on one branch and close them.
updates:
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
      semver-major-days: 7
      semver-minor-days: 5
    groups:
      beni:
        patterns:
          - "beni"
      ruby-deps:
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    # Each entry is a standalone cargo workspace with its own Cargo.lock;
    # the root workspace excludes crates/ and wasm/, so they must be
    # listed explicitly for their manifests to be updatable.
    directories:
      - "/"
      - "/crates"
      - "/wasm"
      - "/wasm/kobako-baker"
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
      semver-major-days: 7
      semver-minor-days: 5
    groups:
      beni:
        patterns:
          - "beni*"
      # wasmtime, wasmtime-wasi, and wasmtime-wizer share one release
      # train, so their minor and patch bumps arrive as a single PR
      # instead of dissolving into the rust-deps catch-all.
      #
      # A major crossing does not: Dependabot raises every major as its
      # own PR whatever a group says, so the train arrives split across
      # crates/ and kobako-baker and each half fails to compile alone.
      # Bump all four declarations on one branch and close those PRs.
      wasmtime-deps:
        patterns:
          - "wasmtime*"
      rust-deps:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      gha-deps:
        update-types:
          - minor
          - patch
