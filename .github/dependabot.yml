version: 2

# The beni gem builds the archive the beni crates link, and the two
# release in lockstep, so a bump of either side arrives with the other
# in one PR rather than as two that each fail alone.
multi-ecosystem-groups:
  beni:
    schedule:
      interval: weekly

updates:
  - package-ecosystem: bundler
    directory: "/"
    multi-ecosystem-group: beni
    patterns: ["beni"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
      semver-major-days: 7
      semver-minor-days: 5
    groups:
      ruby-deps:
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    # Each entry is a standalone cargo workspace with its own Cargo.lock;
    # the root workspace excludes crates/ and wasm/, so they must be
    # listed explicitly for their manifests to be updatable.
    directories:
      - "/"
      - "/crates"
      - "/wasm"
      - "/wasm/kobako-baker"
    multi-ecosystem-group: beni
    patterns: ["beni"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
      semver-major-days: 7
      semver-minor-days: 5
    groups:
      # wasmtime, wasmtime-wasi, and wasmtime-wizer share one release
      # train, so their minor and patch bumps arrive as a single PR
      # instead of dissolving into the rust-deps catch-all.
      #
      # A major crossing does not: Dependabot raises every major as its
      # own PR whatever a group says, so the train arrives split across
      # crates/ and kobako-baker and each half fails to compile alone.
      # Bump all four declarations on one branch and close those PRs.
      wasmtime-deps:
        patterns:
          - "wasmtime*"
      rust-deps:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      gha-deps:
        update-types:
          - minor
          - patch
