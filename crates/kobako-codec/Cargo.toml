# kobako-codec — the payload codecs.
#
# What rides inside a core envelope's opaque payload field, one
# namespace per schema. The replaceable half of the kobako wire: an
# assembly that speaks another schema carries none of this crate, and
# the fixed half (`kobako-transport`) is unchanged by that choice.
# Free of mruby, wasmtime, and any guest-bound ABI so it compiles on
# every target.
#
# This crate is a plain rlib. Packaging rule (workspace-wide): the
# manifest stays self-contained — no `workspace = true` inheritance
# fields — because sibling crates ship in the Ruby gem without the
# workspace manifest.

[package]
name = "kobako-codec"
version = "0.12.0"
edition = "2021"
description = "Payload codecs for the kobako wire — the replaceable half that rides inside a core envelope, MessagePack by default."
license = "Apache-2.0"
repository = "https://github.com/elct9620/kobako"
readme = "README.md"
keywords = ["wasm", "mruby", "sandbox", "wasi", "msgpack"]
categories = ["wasm", "encoding"]

[features]
# The MessagePack payload codec — the `msgpack` namespace and
# everything `rmp` backs. On by default because it is what
# the bundled mruby guest and the Ruby frontend speak; turning it off
# leaves the core envelope, which two endpoints sharing another schema
# can drive with no MessagePack in their dependency graph at all.
default = ["msgpack"]
msgpack = ["dep:rmp"]

[dependencies]
# `rmp` is the low-level (no-serde) Pure Rust MessagePack codec — the
# Rust counterpart of the msgpack-ruby gem used on the host side. The
# codec stays a thin shim over `rmp::encode` / `rmp::decode`, keeping
# the byte form aligned with the host. `default-features = false`
# keeps the dependency footprint minimal on wasm32-wasip1.
rmp = { version = "0.8", default-features = false, optional = true }
