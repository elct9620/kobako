# kobako — the Rust host SDK over the engine-neutral runtime contract.
#
# The bare-name crate a Rust embedder depends on: `Sandbox` composes
# the published tiers (`kobako-transport` envelope, `kobako-codec`
# payload, `kobako-runtime` contract, `kobako-wasmtime` driver) into the
# same host behavior contract the Ruby gem exposes — Service dispatch,
# capability Handles, snippet replay, seal-once registration. The
# Ruby-parity behavior surface is pinned by the differential harness
# under `test/parity/`.

[package]
name = "kobako"
version = "0.13.0"
edition = "2021"
# Recovering a concrete host object from `Sandbox::resolve` upcasts
# `Arc<dyn Receiver>` to `Arc<dyn Any>`, which needs trait-upcasting.
rust-version = "1.86"
description = "kobako host SDK — run untrusted mruby in an in-process Wasm sandbox."
license = "Apache-2.0"
repository = "https://github.com/elct9620/kobako"
readme = "README.md"
keywords = ["wasm", "mruby", "sandbox", "wasi"]
categories = ["wasm", "virtualization"]

[dependencies]
# Fixed tier: the core envelope every message rides in.
kobako-transport = { path = "../kobako-transport", version = "0.13.0" }

# Payload codec: the default schema this SDK's `ValueReceiver` speaks.
# Optional, because every payload position has a byte-level entry: a host
# whose Receivers speak another schema builds without a codec at all.
kobako-codec = { path = "../kobako-codec", version = "0.13.0", optional = true }

# Engine-neutral contract the Sandbox drives an engine through.
kobako-runtime = { path = "../kobako-runtime", version = "0.13.0" }

# Default engine: the wasmtime driver implementing the contract.
# Optional, because `Sandbox::with_runtime` takes any `Runtime`: a host
# bringing its own engine builds without this one, and the claim that the
# engine is replaceable becomes a fact about the dependency graph.
kobako-wasmtime = { path = "../kobako-wasmtime", version = "0.13.0", optional = true }

# Unconditional here, and only here: the bundled guest speaks MessagePack
# whatever this crate is built with, so a test that drives it needs to
# read that schema even when the SDK carries no codec of its own. A
# dev-dependency is absent from the shipped graph, so this leaves the
# codec-free claim `gate:payload:optional` checks untouched.
#
# Path only, deliberately. Cargo strips a version-less path dev-dependency
# when packaging, which costs nothing here: every test reaching for it also
# reaches for `data/kobako.wasm`, which no published crate carries. Naming a
# version instead would put one in a table the release tooling does not
# rewrite, leaving it pinned to the previous release on every bump.
[dev-dependencies]
kobako-codec = { path = "../kobako-codec" }

[features]
# On by default so the ergonomic path — `ValueReceiver`, `Value`, and the
# Value-flavoured spelling of each payload position — is what a caller
# gets without asking. Off, the SDK keeps only its byte-level surface and
# resolves to no payload codec, which is what makes "the codec is
# replaceable" a property of the dependency graph rather than a claim.
default = ["msgpack", "wasmtime"]
msgpack = ["dep:kobako-codec"]
# On by default so `Sandbox::new` — the path that loads a Guest Binary and
# needs no engine decision — is what a caller gets without asking. Off, the
# SDK keeps `Sandbox::with_runtime` and resolves to no engine, which is the
# same standard the codec is held to.
wasmtime = ["dep:kobako-wasmtime"]
