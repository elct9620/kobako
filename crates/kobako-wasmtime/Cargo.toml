# kobako-wasmtime — the wasmtime implementation of the kobako runtime
# contract.
#
# The engine half of a kobako host: `Driver` implements
# `kobako_runtime::runtime::Runtime` over wasmtime, owning every
# engine-bound mechanic — the process-wide Engine + compiled-Module
# caches, the pre-linked `InstancePre`, the epoch wall-clock timeout,
# the linear-memory cap, and the frozen-clock / constant-RNG ambient
# denial. Frontends (the kobako Ruby gem's native ext) construct a
# `Driver` and drive invocations through the contract trait only.
#
# Self-contained by design: the Ruby gem ships this crate without the
# `crates/` workspace manifest, so no `workspace = true` inheritance
# fields may appear here.

[package]
name = "kobako-wasmtime"
version = "0.22.0"
edition = "2021"
# The toolchain this crate is built and tested on, the first whose stripped
# Apple binary macOS 26 loads.
rust-version = "1.98"
description = "wasmtime implementation of the kobako host runtime contract."
license = "Apache-2.0"
repository = "https://github.com/elct9620/kobako"
readme = "README.md"
keywords = ["wasm", "mruby", "sandbox", "wasi", "wasmtime"]
categories = ["wasm", "virtualization"]
# The tests reach files only this repository holds, so a copy of the crate
# taken to customize builds without them.
exclude = ["tests/"]

[dependencies]
# The engine-neutral contract this crate implements. The version pin
# rides the linked release group; the path keeps in-tree builds (and
# the Ruby gem, which ships both crates) resolving locally.
kobako-runtime = { version = "0.22.0", path = "../kobako-runtime" }
# The fixed tier: the Envelope this driver shuttles and the ABI
# values it drives the exports against.
kobako-transport = { version = "0.22.0", path = "../kobako-transport" }
# wasmtime — host-side embedder for kobako.wasm. We disable default-features
# and opt back in only what kobako needs: a Cranelift-backed runtime that can
# compile a pre-built wasm32-wasip1 module on the host triple, plus the `wat`
# feature so test fixtures can be expressed as text.
# `cache` / `parallel-compilation` / `pooling` are intentionally off —
# kobako runs short-lived synchronous sandboxes. `component-model` and
# `async` still arrive through wasmtime-wasi's `p1`, which builds on `p2`;
# kobako loads only core Modules, so none of that code is reached. The floor
# is the first 50 release carrying the engine's security fixes.
wasmtime = { version = "50.0.1", default-features = false, features = [
    "cranelift",
    "runtime",
    "gc",
    "gc-drc",
    "addr2line",
    "demangle",
    "wat",
] }
# wasmtime-wasi answers the preview1 calls that read no descriptor
# (args, environ, clocks, random); kobako answers every call that reads
# its own descriptor table. `p1` is the only feature kobako asks for; it
# enables `p2` itself, while `p0` and `p3` stay off.
wasmtime-wasi = { version = "50.0.1", default-features = false, features = ["p1"] }
# rand names the generator wasmtime-wasi takes for a guest's entropy;
# `sys_rng` asks the OS on each draw, so a forked child holds no state that
# repeats its parent's draws, as a thread's ThreadRng does.
rand = { version = "0.10.1", default-features = false, features = ["sys_rng"] }
# wiggle generates the preview1 calls kobako answers from `witx/`, as it
# generates wasmtime-wasi's, so each takes its arguments and writes its answer
# as wasmtime-wasi does. It rides wasmtime's release train.
wiggle = { version = "50.0.1", default-features = false, features = ["wasmtime"] }
# sha2 keys the on-disk compiled-module cache by Guest Binary content
# (see cache.rs); a collision would load the wrong artifact, so the
# hash must be cryptographic.
sha2 = "0.11"

[dev-dependencies]
# wasmparser reads the bundled Guest Binary, to witness what each ABI export
# can call and what the binary imports.
wasmparser = "0.263.0"

# libc forks a test's process, to witness what a child keeps of its parent.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2.191"

[build-dependencies]
# build.rs generates the WASI 0.2 imports a Guest Binary links as a core
# module from `wit/`, as wiggle generates preview1's from `witx/`.
# wit-bindgen-core walks the Canonical ABI and re-exports the wit-parser
# it was built against.
wit-bindgen-core = "0.63.0"
# wit-parser reports a malformed `wit/` as `anyhow::Error`, which build.rs
# hands back to cargo.
anyhow = "1.0.102"

[features]
# Off by default, as in wasmtime, so a host whose crash reporter takes
# faults over a Mach port, as breakpad does, still sees the guest's apart
# from its own. On, a guest's faults on macOS arrive as POSIX signals, which
# a forked child keeps; one setting holds for the whole process.
posix-signals-on-macos = []

# rustix reaches the cache directory through one descriptor, checked by
# owner, so the unsafe artifact deserialize reads only what that
# directory holds (see cache.rs); std has no `*at` calls.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs", "process"] }

# windows-sys reads and sets the cache directory's owner and DACL, which std
# cannot, so the unsafe artifact deserialize trusts it only as rustix lets
# Unix trust it.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_SystemServices", "Win32_System_Threading"] }
