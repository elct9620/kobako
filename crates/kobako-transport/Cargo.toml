# kobako-transport — the fixed tier of the kobako wire.
#
# The core envelope: the outer frame every host↔guest message rides in,
# carrying routing and outcome attribution and handing the payload
# through untouched. A host, a payload codec, and a guest are chosen
# independently only because this layer is the same in every assembly,
# so it depends on nothing and everything else depends on it.
#
# Self-contained by design: the Ruby gem ships this crate without the
# `crates/` workspace manifest, so no `workspace = true` inheritance
# fields may appear here.

[package]
name = "kobako-transport"
version = "0.14.0"
edition = "2021"
description = "The kobako core envelope — the fixed host↔guest wire frame every assembly shares."
license = "Apache-2.0"
repository = "https://github.com/elct9620/kobako"
readme = "README.md"
keywords = ["wasm", "mruby", "sandbox", "wasi"]
categories = ["wasm", "encoding"]

# No dependencies, and none may be added: a tier every other tier
# depends on cannot carry a choice any of them might want to make
# differently.
[dependencies]
