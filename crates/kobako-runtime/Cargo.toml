# kobako-runtime — engine-neutral host runtime contract.
#
# The contract a wasm engine must satisfy to drive a kobako guest,
# free of any engine or frontend type: the `Runtime` trait plus the
# neutral value types (`Snapshot`, `Trap`, `SetupError`, ...), the
# dispatch / yield re-entry traits a frontend supplies, and the Grants
# a frontend hands each invocation, the Mount and the Filesystems it
# places. Engine implementations (`kobako-wasmtime`) and host frontends
# (the Ruby ext) meet on this surface, so the engine stays swappable.
# `cap-std` confines a Bind to its host directory.
#
# Self-contained by design: the Ruby gem ships this crate without the
# `crates/` workspace manifest, so no `workspace = true` inheritance
# fields may appear here.

[package]
name = "kobako-runtime"
version = "0.19.0"
edition = "2021"
description = "Engine-neutral host runtime contract for embedding kobako Wasm guests."
license = "Apache-2.0"
repository = "https://github.com/elct9620/kobako"
readme = "README.md"
keywords = ["wasm", "mruby", "sandbox", "wasi"]
categories = ["wasm", "virtualization"]

# The fixed tier: the core envelope this contract routes and attributes
# through. The version pin rides the linked release group; the path keeps
# in-tree builds (and the Ruby gem, which ships both crates) resolving
# locally.
[dependencies]
kobako-transport = { version = "0.19.0", path = "../kobako-transport" }
# cap-std resolves each name a Bind is asked beneath its host directory,
# refusing a `..` or a symbolic link that would lead out of it.
# 4.0.3 is the first release whose trailing-slash lookup keeps that
# refusal (GHSA-hp8f-xmx4-4qrg).
cap-std = "4.0.3"
# cap-fs-ext opens a Bind's directory by name without following a link,
# so a Mount's Policy judges the path its call reaches.
cap-fs-ext = "4.0.3"

# rustix switches a Bind's file to append mode for one write, so the
# host places it at the file's end in one step; std cannot set file flags.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs"] }

# libc asks macOS for the name a directory stores, which a Mount's Policy
# judges in place of a spelling the host folds; rustix has no
# getattrlist.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.191"
